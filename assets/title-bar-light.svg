<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 96" width="1600" height="96" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="glow-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="blur"></feGaussianBlur>
      <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <filter id="glow-line" x="-5%" y="-200%" width="110%" height="500%">
      <feGaussianBlur stdDeviation="1.4" result="blur"></feGaussianBlur>
      <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>

    
    <linearGradient id="panel-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DCE0E5"></stop>
      <stop offset="50%" stop-color="#D2D7DD"></stop>
      <stop offset="100%" stop-color="#C6CBD2"></stop>
    </linearGradient>

    
    <linearGradient id="top-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C25E0A" stop-opacity="0"></stop>
      <stop offset="10%" stop-color="#C25E0A" stop-opacity="0.85"></stop>
      <stop offset="30%" stop-color="#C25E0A" stop-opacity="1"></stop>
      <stop offset="50%" stop-color="#E0852A" stop-opacity="1"></stop>
      <stop offset="70%" stop-color="#C25E0A" stop-opacity="1"></stop>
      <stop offset="90%" stop-color="#C25E0A" stop-opacity="0.85"></stop>
      <stop offset="100%" stop-color="#C25E0A" stop-opacity="0"></stop>
    </linearGradient>

    
    <linearGradient id="bot-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A6AEB9" stop-opacity="0"></stop>
      <stop offset="8%" stop-color="#A6AEB9" stop-opacity="0.8"></stop>
      <stop offset="50%" stop-color="#A6AEB9" stop-opacity="0.55"></stop>
      <stop offset="92%" stop-color="#A6AEB9" stop-opacity="0.8"></stop>
      <stop offset="100%" stop-color="#A6AEB9" stop-opacity="0"></stop>
    </linearGradient>

    
    <linearGradient id="left-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C25E0A" stop-opacity="0.12"></stop>
      <stop offset="100%" stop-color="#C25E0A" stop-opacity="0"></stop>
    </linearGradient>
    <linearGradient id="right-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C25E0A" stop-opacity="0"></stop>
      <stop offset="100%" stop-color="#C25E0A" stop-opacity="0.12"></stop>
    </linearGradient>

    
    <radialGradient id="center-glow" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#C25E0A" stop-opacity="0.06"></stop>
      <stop offset="100%" stop-color="#C6CBD2" stop-opacity="0"></stop>
    </radialGradient>

    
    <pattern id="hexPat" x="0" y="0" width="60" height="104" patternUnits="userSpaceOnUse">
      <polygon points="30,2 58,17 58,47 30,62 2,47 2,17" fill="none" stroke="#8A929C" stroke-width="0.6" opacity="0.16"></polygon>
      <polygon points="30,54 58,69 58,99 30,114 2,99 2,69" fill="none" stroke="#8A929C" stroke-width="0.6" opacity="0.16"></polygon>
    </pattern>
  </defs>

  
  <rect width="1600" height="96" fill="url(#panel-bg)"></rect>

  
  <rect width="1600" height="96" fill="url(#hexPat)" opacity="0.6"></rect>

  
  <rect width="1600" height="96" fill="url(#center-glow)"></rect>

  
  <rect x="0" y="0" width="1600" height="2.5" fill="url(#top-border)" filter="url(#glow-line)"></rect>
  <rect x="0" y="93" width="1600" height="1" fill="url(#bot-border)"></rect>

  
  
  <rect x="0" y="0" width="280" height="96" fill="url(#left-fade)"></rect>

  
  <g stroke="#C25E0A" stroke-width="1.5" fill="none" opacity="0.8">
    <polyline points="14,8 14,24"></polyline>   
    <polyline points="14,8 38,8"></polyline>    
  </g>
  <g stroke="#E0852A" stroke-width="0.5" fill="none" opacity="0.55">
    <polyline points="18,12 18,24"></polyline> 
    <polyline points="18,12 38,12"></polyline> 
  </g>

  
  <g stroke="#C25E0A" stroke-width="1.5" fill="none" opacity="0.8">
    <polyline points="14,88 14,72"></polyline> 
    <polyline points="14,88 38,88"></polyline>
  </g>

  
  
  <line x1="0" y1="30" x2="240" y2="30" stroke="#9AA2AC" stroke-width="0.8" opacity="0.5"></line>
  
  <line x1="0" y1="48" x2="310" y2="48" stroke="#9AA2AC" stroke-width="0.5" opacity="0.32"></line>
  
  <line x1="0" y1="66" x2="240" y2="66" stroke="#9AA2AC" stroke-width="0.8" opacity="0.5"></line>

  
  <line x1="0" y1="48" x2="180" y2="48" stroke="#C25E0A" stroke-width="1" opacity="0.32" filter="url(#glow-line)"></line>

  
  <polygon points="268,48 282,40 296,48 282,56" fill="none" stroke="#C25E0A" stroke-width="1.5" opacity="0.75" filter="url(#glow-soft)"></polygon>
  <polygon points="274,48 282,44 290,48 282,52" fill="#C25E0A" opacity="0.5" filter="url(#glow-soft)"></polygon>
  
  <line x1="240" y1="48" x2="268" y2="48" stroke="#9AA2AC" stroke-width="0.8" opacity="0.5"></line>

  
  <g stroke="#9AA2AC" stroke-width="0.8" opacity="0.5">
    <line x1="80" y1="27" x2="80" y2="33"></line>
    <line x1="140" y1="27" x2="140" y2="33"></line>
    <line x1="190" y1="27" x2="190" y2="33"></line>
    <line x1="80" y1="63" x2="80" y2="69"></line>
    <line x1="140" y1="63" x2="140" y2="69"></line>
    <line x1="190" y1="63" x2="190" y2="69"></line>
  </g>

  
  <rect x="1320" y="0" width="280" height="96" fill="url(#right-fade)"></rect>

  
  <g stroke="#C25E0A" stroke-width="1.5" fill="none" opacity="0.8">
    <polyline points="1586,8 1586,24"></polyline>
    <polyline points="1586,8 1562,8"></polyline>
  </g>
  <g stroke="#E0852A" stroke-width="0.5" fill="none" opacity="0.55">
    <polyline points="1582,12 1582,24"></polyline>
    <polyline points="1582,12 1562,12"></polyline>
  </g>

  
  <g stroke="#C25E0A" stroke-width="1.5" fill="none" opacity="0.8">
    <polyline points="1586,88 1586,72"></polyline>
    <polyline points="1586,88 1562,88"></polyline>
  </g>

  
  <line x1="1600" y1="30" x2="1360" y2="30" stroke="#9AA2AC" stroke-width="0.8" opacity="0.5"></line>
  <line x1="1600" y1="48" x2="1290" y2="48" stroke="#9AA2AC" stroke-width="0.5" opacity="0.32"></line>
  <line x1="1600" y1="66" x2="1360" y2="66" stroke="#9AA2AC" stroke-width="0.8" opacity="0.5"></line>
  <line x1="1600" y1="48" x2="1420" y2="48" stroke="#C25E0A" stroke-width="1" opacity="0.32" filter="url(#glow-line)"></line>

  
  <polygon points="1332,48 1318,40 1304,48 1318,56" fill="none" stroke="#C25E0A" stroke-width="1.5" opacity="0.75" filter="url(#glow-soft)"></polygon>
  <polygon points="1326,48 1318,44 1310,48 1318,52" fill="#C25E0A" opacity="0.5" filter="url(#glow-soft)"></polygon>
  <line x1="1360" y1="48" x2="1332" y2="48" stroke="#9AA2AC" stroke-width="0.8" opacity="0.5"></line>

  
  <g stroke="#9AA2AC" stroke-width="0.8" opacity="0.5">
    <line x1="1520" y1="27" x2="1520" y2="33"></line>
    <line x1="1460" y1="27" x2="1460" y2="33"></line>
    <line x1="1410" y1="27" x2="1410" y2="33"></line>
    <line x1="1520" y1="63" x2="1520" y2="69"></line>
    <line x1="1460" y1="63" x2="1460" y2="69"></line>
    <line x1="1410" y1="63" x2="1410" y2="69"></line>
  </g>

  
  
  <line x1="310" y1="48" x2="560" y2="48" stroke="#9AA2AC" stroke-width="0.4" opacity="0.25"></line>
  <line x1="540" y1="44" x2="560" y2="48" stroke="#9AA2AC" stroke-width="1" opacity="0.4"></line>
  <line x1="540" y1="52" x2="560" y2="48" stroke="#9AA2AC" stroke-width="1" opacity="0.4"></line>

  
  <line x1="1290" y1="48" x2="1040" y2="48" stroke="#9AA2AC" stroke-width="0.4" opacity="0.25"></line>
  <line x1="1060" y1="44" x2="1040" y2="48" stroke="#9AA2AC" stroke-width="1" opacity="0.4"></line>
  <line x1="1060" y1="52" x2="1040" y2="48" stroke="#9AA2AC" stroke-width="1" opacity="0.4"></line>

  
  
  <polygon points="52,14 62,8 72,14 72,26 62,32 52,26" fill="none" stroke="#9AA2AC" stroke-width="0.8" opacity="0.2"></polygon>
  
  <polygon points="1528,14 1538,8 1548,14 1548,26 1538,32 1528,26" fill="none" stroke="#9AA2AC" stroke-width="0.8" opacity="0.2"></polygon>
  
  <polygon points="52,64 62,58 72,64 72,76 62,82 52,76" fill="none" stroke="#9AA2AC" stroke-width="0.8" opacity="0.2"></polygon>
  
  <polygon points="1528,64 1538,58 1548,64 1548,76 1538,82 1528,76" fill="none" stroke="#9AA2AC" stroke-width="0.8" opacity="0.2"></polygon>

</svg>