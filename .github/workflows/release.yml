# Builds a release when a version tag is pushed:
#
#     git tag 1.3.0 && git push origin 1.3.0
#
# The tag must equal config.APP_VERSION. The result is a DRAFT GitHub Release
# holding the installer and its .sha256. Drafts are invisible to EDLS's update
# check, so nobody is offered the update until the draft's notes are written
# and it is published.
name: Release

on:
  push:
    tags: ["[0-9]*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag matches config.APP_VERSION
        shell: pwsh
        run: |
          $version = "$(python -c 'import config; print(config.APP_VERSION)')".Trim()
          if ($version -ne $env:GITHUB_REF_NAME) {
            Write-Error "Tag $env:GITHUB_REF_NAME doesn't match config.APP_VERSION ($version)."
            exit 1
          }

      - name: Self-test
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet -r requirements.txt
          python selftest.py

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - name: Build
        shell: pwsh
        run: .\build.ps1

      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:GITHUB_REF_NAME
          gh release create $v "dist\EDLS-Setup-$v.exe" "dist\EDLS-Setup-$v.exe.sha256" `
            --draft --title "Release $v" --generate-notes
