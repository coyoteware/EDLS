<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal lost · EDLS</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#090905">
<!-- GitHub Pages serves this for any missing path, so asset URLs are absolute. -->
<link rel="icon" href="/EDLS/img/icon.svg" type="image/svg+xml">
<link rel="icon" href="/EDLS/favicon.ico" sizes="any">
<script>
  (function () {
    var t;
    try { t = localStorage.getItem("edls-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="stylesheet" href="/EDLS/ds/styles.css">
<link rel="stylesheet" href="/EDLS/css/site.css">
<style>
  .lost { min-height: 100vh; display: grid; place-items: center; padding: 32px 0; }
  .lost .ed-panel { width: min(560px, 100%); }
  .lost h1 {
    margin: 8px 0 16px; font-family: var(--font-display); font-weight: 700;
    font-size: clamp(26px, 6vw, 40px); letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--text-accent); text-shadow: var(--heading-glow);
  }
  .lost .ed-log { margin-bottom: 20px; }
</style>
</head>
<body>
<main class="lost">
  <div class="wrap" style="display:grid;place-items:center">
    <div class="ed-panel hud boot">
      <div class="ed-panel-head"><p class="ed-eyebrow">Error 404</p><span class="ed-panel-meta">launcher.log</span></div>
      <h1>Signal lost</h1>
      <ul class="ed-log">
        <li class="error"><span class="ts">[--:--:--]</span> Requested page not found.</li>
        <li class="dim"><span class="ts">[--:--:--]</span> Plotting a route home...</li>
      </ul>
      <a class="ed-btn ed-btn--launch" href="/EDLS/">Return to EDLS</a>
    </div>
  </div>
</main>
</body>
</html>
